# Деплой веб-приложения на GitHub Pages
# Активируется когда apps/web будет готов
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'data/**'
      - 'content/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
