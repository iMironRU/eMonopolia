# Валидация YAML-данных и сборка приложения при каждом PR
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Validate data/
        run: npm ci && npm run validate:data
      - name: Typecheck and build web app
        working-directory: apps/web
        run: npm ci && npm run typecheck && npm run build
